version: '3.8'

services:
  product-service:
    build:
      context: ./apps/product-service
      dockerfile: Dockerfile
    ports:
      - "3001:3001"
    environment:
      - NODE_ENV=production

  order-service:
    build:
      context: ./apps/order-service
      dockerfile: Dockerfile
    ports:
      - "3002:3002"
    environment:
      - NODE_ENV=production
      - PRODUCT_SERVICE_URL=http://product-service:3001
    depends_on:
      - product-service

  api-gateway:
    build:
      context: ./apps/api-gateway
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
    depends_on:
      - product-service
      - order-service